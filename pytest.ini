[pytest]
# Peer-review T1: every tests/test_*.py file already has its own correct pass/fail logic (a
# `failures` list + printed PASS/FAIL + sys.exit(1)), written as a plain script, not a pytest
# module -- check() never raises, so pytest's DEFAULT file glob (test_*.py) would otherwise
# also collect every test_* function in all of them directly, silently "passing" each one
# regardless of its real outcome (since nothing there raises) while running alongside
# test_all_scripts_pass.py's own correct subprocess-based checks -- confusing, redundant, and
# exactly the kind of false-green result this file exists to prevent.
#
# Narrowing python_files to just the one bridge module makes pytest's own native collection
# leave the other files alone entirely; they're still exercised, but only via that bridge's
# subprocess calls (i.e. the exact same way they've always been run: `python3 tests/test_X.py`).
python_files = test_all_scripts_pass.py
