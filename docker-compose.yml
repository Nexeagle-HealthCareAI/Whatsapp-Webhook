services:
  redis:
    image: redis:7
    container_name: booking-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  fastapi:
    build: .
    container_name: booking-fastapi
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      WHATSAPP_TOKEN: "${WHATSAPP_TOKEN}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    # Bound to localhost only — the VM's existing shared Caddy/reverse proxy (already
    # serving other nexeagle.com subdomains) reverse_proxy's to this from the host side.
    # This stack does NOT run its own Caddy: a second process can't also bind 80/443
    # on a VM that already has one holding them for other services.
    ports:
      - "127.0.0.1:8001:8001"

  worker:
    build: .
    container_name: booking-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    depends_on:
      - redis
    environment:
      WHATSAPP_TOKEN: "${WHATSAPP_TOKEN}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"

volumes:
  redis-data:
