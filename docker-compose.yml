services:
  redis:
    image: redis:7
    container_name: booking-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  fastapi:
    build: .
    container_name: booking-fastapi
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      WHATSAPP_TOKEN: "${WHATSAPP_TOKEN}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      HMS_API_BASE_URL: "${HMS_API_BASE_URL:-https://1hms-dev-api.nexeagle.com}"
      HMS_API_KEY: "${HMS_API_KEY:-}"
      SQLSERVER_CONN_STRING: "${SQLSERVER_CONN_STRING}"
      # Authenticates 1HMS/1Rad's POST /events/token-called calls into this gateway (app/webhook.py)
      # — a different secret from WHATSAPP_APP_SECRET, which authenticates Meta instead.
      INTERNAL_EVENTS_TOKEN: "${INTERNAL_EVENTS_TOKEN}"
      SARVAM_API_KEY: "${SARVAM_API_KEY}"
      # Only this service serves GET /c/{hospital_code} (worker.py never mounts the FastAPI
      # app) -- optional, see app/config.py for why an unset value degrades gracefully.
      WHATSAPP_DISPLAY_NUMBER: "${WHATSAPP_DISPLAY_NUMBER:-}"
    # Bound to localhost only — the VM's existing shared Caddy/reverse proxy (already
    # serving other nexeagle.com subdomains) reverse_proxy's to this from the host side.
    # This stack does NOT run its own Caddy: a second process can't also bind 80/443
    # on a VM that already has one holding them for other services.
    ports:
      - "127.0.0.1:8001:8001"

  worker:
    build: .
    container_name: booking-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    depends_on:
      - redis
    # Lets SQLSERVER_CONN_STRING / SYMPTOM_API_BASE_URL target host.docker.internal — the
    # sqlserver container and nexeagle-website-dev's /api/search/parse proxy (port 82, the
    # reachable entry point for symptom routing in dev) are both on the host's own network,
    # not this compose project's own (it's a separate compose project/service entirely).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WHATSAPP_TOKEN: "${WHATSAPP_TOKEN}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      HMS_API_BASE_URL: "${HMS_API_BASE_URL:-https://1hms-dev-api.nexeagle.com}"
      HMS_API_KEY: "${HMS_API_KEY:-}"
      SQLSERVER_CONN_STRING: "${SQLSERVER_CONN_STRING}"
      SYMPTOM_API_BASE_URL: "${SYMPTOM_API_BASE_URL:-http://host.docker.internal:82}"
      INTERNAL_EVENTS_TOKEN: "${INTERNAL_EVENTS_TOKEN}"
      # NLU classification (app/nlu_client.py) runs inside this container via
      # conversation.handle_message — without this, settings.sarvam_api_key is None here
      # and every message silently falls back to out_of_scope (see nlu_logs).
      SARVAM_API_KEY: "${SARVAM_API_KEY}"
      # The patient-details WhatsApp Flow -- only read here (_send_patient_details_flow,
      # app/conversation/__init__.py), which only ever runs inside this container. Default
      # matches app/config.py's own default -- an unset/empty value here would otherwise
      # override that Python-level default with an empty string, not fall back to it.
      WHATSAPP_FLOW_ID: "${WHATSAPP_FLOW_ID}"
      WHATSAPP_FLOW_SCREEN_ID: "${WHATSAPP_FLOW_SCREEN_ID:-REGISTRATION_SCREEN}"

  sender:
    build: .
    container_name: booking-sender
    restart: unless-stopped
    command: ["python", "sender.py"]
    depends_on:
      - redis
    # Drains app/messengers/outbound_queue.py's whatsapp:outbox at a steady, Meta-safe
    # pace -- functionally only needs Redis and the WhatsApp send credentials.
    # SQLSERVER_CONN_STRING/INTERNAL_EVENTS_TOKEN are still required below because
    # app.config.Settings validates every required field at import time, even ones this
    # process never touches. See sender.py / app/messengers/outbound_queue.py.
    environment:
      WHATSAPP_TOKEN: "${WHATSAPP_TOKEN}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      SQLSERVER_CONN_STRING: "${SQLSERVER_CONN_STRING}"
      INTERNAL_EVENTS_TOKEN: "${INTERNAL_EVENTS_TOKEN}"

  conversation-logger:
    build: .
    container_name: booking-conversation-logger
    restart: unless-stopped
    command: ["python", "conversation_logger.py"]
    depends_on:
      - redis
    # Drains app/messengers/conversation_log_queue.py's whatsapp:conversation_log into
    # dbo.conversation_sessions -- only needs Redis and the DB, no WhatsApp send credentials.
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      SQLSERVER_CONN_STRING: "${SQLSERVER_CONN_STRING}"
      WHATSAPP_TOKEN: "${WHATSAPP_TOKEN}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET}"
      INTERNAL_EVENTS_TOKEN: "${INTERNAL_EVENTS_TOKEN}"

  scheduler:
    build: .
    container_name: booking-scheduler
    restart: unless-stopped
    command: ["python", "scheduler.py"]
    # No Redis dependency (this loop is time-driven, not queue-driven — see scheduler.py's
    # own docstring) but does need the same DB + WhatsApp send credentials as the worker.
    environment:
      WHATSAPP_TOKEN: "${WHATSAPP_TOKEN}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      HMS_API_BASE_URL: "${HMS_API_BASE_URL:-https://1hms-dev-api.nexeagle.com}"
      HMS_API_KEY: "${HMS_API_KEY:-}"
      SQLSERVER_CONN_STRING: "${SQLSERVER_CONN_STRING}"
      INTERNAL_EVENTS_TOKEN: "${INTERNAL_EVENTS_TOKEN}"

volumes:
  redis-data:
